      /* Instant boot loader: paints before any JavaScript, then React's own loading screen takes over */
      html,body{margin:0;background:#000}
      #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
      #boot svg{width:64px;height:64px;animation:bootSpin 1.4s linear infinite}
      #boot circle{fill:none;stroke-width:3}
      #boot .t{stroke:rgba(244,241,234,.12)}
      #boot .a{stroke:#6f906f;stroke-linecap:round;stroke-dasharray:70 144;transform-origin:40px 40px}
      @keyframes bootSpin{to{transform:rotate(360deg)}}
    </style>
