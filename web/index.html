    <style>
      /* Instant boot loader: a soft poster of the real 3D scene (blur baked into the image, no CSS filters, so the
         phone's GPU is free for the 3D scene), painted before any JavaScript.
         React fills the progress line and fades it out as the live scene sharpens in (src/ui/LoadingScreen.tsx). */
      html,body{margin:0;background:#0a0c14}
      html[data-theme=light],html[data-theme=light] body{background:#eceff4}
      #boot{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#0a0c14;color:#f4f1ea;font-family:Inter,'Helvetica Neue',system-ui,-apple-system,'Segoe UI',sans-serif;transition:opacity .7s ease}
      #boot .bp{position:absolute;inset:0;background:url(./loader/poster-dark-p45.webp) center/auto 100% no-repeat}
      #boot .bg{position:absolute;inset:0;background:linear-gradient(to top,#0a0c14 0%,rgba(10,12,20,.8) 14%,rgba(10,12,20,0) 42%)}
      #boot .bt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .4s ease}
      #boot b{font-size:15px;font-weight:600;letter-spacing:-.01em}
      #boot .bb{width:160px;height:2px;border-radius:2px;background:rgba(244,241,234,.2);overflow:hidden}
      #boot .bb i{display:block;height:100%;width:30%;border-radius:2px;background:currentColor;animation:bootGo 1.6s ease-in-out infinite}
      #boot.has-p .bb i{animation:none;transition:width .35s ease}
      #boot small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
      #boot.is-done{opacity:0;pointer-events:none}
      #boot.is-done .bt{opacity:0}
      html[data-theme=light] #boot{background:#eceff4;color:#1b1f2a}
      html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-p45.webp)}
      /* one poster per screen shape: the 3D camera pulls back on narrower screens, so the shape decides the framing */
      @media (min-aspect-ratio:19/40){#boot .bp{background-image:url(./loader/poster-dark-p50.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-p50.webp)}}
      @media (min-aspect-ratio:21/40){#boot .bp{background-image:url(./loader/poster-dark-p55.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-p55.webp)}}
      @media (min-aspect-ratio:23/40){#boot .bp{background-image:url(./loader/poster-dark-p60.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-p60.webp)}}
      @media (min-aspect-ratio:13/20){#boot .bp{background-image:url(./loader/poster-dark-p70.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-p70.webp)}}
      @media (min-aspect-ratio:29/40){#boot .bp{background-image:url(./loader/poster-dark-p75.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-p75.webp)}}
      @media (min-aspect-ratio:21/20){#boot .bp{background-image:url(./loader/poster-dark-d133.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-d133.webp)}}
      @media (min-aspect-ratio:29/20){#boot .bp{background-image:url(./loader/poster-dark-desk.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-desk.webp)}}
      @media (min-aspect-ratio:169/100){#boot .bp{background-image:url(./loader/poster-dark-d178.webp)}html[data-theme=light] #boot .bp{background-image:url(./loader/poster-light-d178.webp)}}
      html[data-theme=light] #boot .bg{background:linear-gradient(to top,#eceff4 0%,rgba(236,239,244,.8) 14%,rgba(236,239,244,0) 42%)}
      html[data-theme=light] #boot .bb{background:rgba(27,31,42,.18)}
      @keyframes bootGo{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
      @media (prefers-reduced-motion:reduce){#boot .bb i{animation:none;width:45%}#boot{transition:none}}
    </style>

    <noscript><div style="font:16px/1.5 system-ui;color:#f4f1ea;background:#0a0e16;padding:32px;min-height:100vh"><h1>Vishal Ghuge · AI Product Manager</h1><p>AI and SaaS products from 0 to 1. Product Manager at Fractal Analytics, Mumbai.</p><p><a style="color:#ffd9b3" href="./Vishal_Ghuge_CV.pdf">Download CV</a> · <a style="color:#ffd9b3" href="mailto:vishalghuge26@gmail.com">vishalghuge26@gmail.com</a></p><h2>Work</h2><ul><li><b>iqigai</b>: matches bench people to open roles and explains every recommendation. 5,276+ daily users; PM selection rate up from 10% to 50%.</li><li><b>Total Environment</b>: a web 3D design tool and buyer portal. 300+ screens, rolled out organisation-wide.</li><li><b>Foyr Ideate</b>: AI interior design, from 0 to MVP in 5 months.</li><li><b>Amazon MX Player</b>: 300,000+ content units, +50% output in a month, 56 shows live in a week.</li></ul><p>The full portfolio is an interactive 3D site and needs JavaScript.</p></div></noscript>
